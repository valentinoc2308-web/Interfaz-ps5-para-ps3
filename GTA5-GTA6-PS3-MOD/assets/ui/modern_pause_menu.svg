<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>Original modern open-world pause menu concept</title>
  <desc>Original offline single-player pause menu layout, designed as transparent source artwork.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1219" stop-opacity=".94"/>
      <stop offset="1" stop-color="#1b2933" stop-opacity=".91"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ce0c1"/>
      <stop offset="1" stop-color="#83d6ff"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#050a0e" opacity=".42"/>
  <rect x="54" y="42" width="1172" height="636" rx="22" fill="url(#shade)" stroke="#ffffff" stroke-opacity=".16"/>
  <rect x="54" y="42" width="300" height="636" rx="22" fill="#101b24" opacity=".96"/>
  <path d="M354 42v636" stroke="#ffffff" stroke-opacity=".12"/>
  <g font-family="Arial, Helvetica, sans-serif">
