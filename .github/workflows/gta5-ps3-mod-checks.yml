name: GTA V PS3 project checks

on:
  push:
    paths:
      - "GTA5-GTA6-PS3-MOD/**"
      - ".github/workflows/gta5-ps3-mod-checks.yml"
  pull_request:
    paths:
      - "GTA5-GTA6-PS3-MOD/**"
      - ".github/workflows/gta5-ps3-mod-checks.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile-check Python tools
        run: python -m py_compile GTA5-GTA6-PS3-MOD/tools/validate_project.py GTA5-GTA6-PS3-MOD/tools/test_validate_project.py GTA5-GTA6-PS3-MOD/tools/validate_assets.py
      - name: Run regression tests
        working-directory: GTA5-GTA6-PS3-MOD/tools
        run: python -m unittest -v
      - name: Validate project manifest
        run: python GTA5-GTA6-PS3-MOD/tools/validate_project.py
      - name: Validate original HUD SVG source
        run: python GTA5-GTA6-PS3-MOD/tools/validate_assets.py
      - name: Install SVG renderer
        run: python -m pip install CairoSVG
      - name: Render transparent HUD preview
        run: python GTA5-GTA6-PS3-MOD/tools/build_hud_preview.py
      - name: Upload HUD preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: gta5-ps3-hud-preview
          path: GTA5-GTA6-PS3-MOD/build/modern_hud_concept.png
          if-no-files-found: error
