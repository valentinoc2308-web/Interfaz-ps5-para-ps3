name: GTA V PS3 native mod PKG

on:
  workflow_dispatch:
  push:
    paths:
      - "GTA5-GTA6-PS3-MOD/integration/**"
      - "GTA5-GTA6-PS3-MOD/tools/package_release_gate.py"
      - ".github/workflows/gta5-ps3-mod-pkg.yml"

permissions:
  contents: read

jobs:
  release-pkg:
    runs-on: ubuntu-22.04
    env:
      PS3DEV: /usr/local/ps3dev
      PSL1GHT: /usr/local/ps3dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify native integration and release evidence
        run: python3 GTA5-GTA6-PS3-MOD/tools/package_release_gate.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison flex gcc g++ make libelf-dev texinfo \
            libncurses5-dev patch python3 python-is-python3 subversion wget zlib1g-dev \
            libtool-bin python3-dev bzip2 libgmp3-dev pkg-config libssl-dev git clang

      - name: Cache PS3 toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: /usr/local/ps3dev
          key: ps3dev-psl1ght-ubuntu22-gta-mod-v1

      - name: Build PS3 toolchain and PSL1GHT
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo mkdir -p "$PS3DEV"
          sudo chown -R "$USER":"$USER" "$PS3DEV"
          git clone --depth 1 https://github.com/ps3dev/ps3toolchain.git /tmp/ps3toolchain
          cd /tmp/ps3toolchain
          ./toolchain.sh
          git clone --depth 1 https://github.com/ps3dev/PSL1GHT.git /tmp/PSL1GHT
          cd /tmp/PSL1GHT
          make install-ctrl
          make -j2
          make install

      - name: Add PS3 tools to PATH
        run: |
          echo "$PS3DEV/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/ppu/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/spu/bin" >> "$GITHUB_PATH"

      - name: Build native mod package
        working-directory: GTA5-GTA6-PS3-MOD/integration
        run: |
          set -euo pipefail
          make clean || true
          make -j2 pkg
          test -s build/*.pkg

      - name: Upload verified PKG
        uses: actions/upload-artifact@v4
        with:
          name: GTA5-NPEB01283-native-mod-PKG
          path: GTA5-GTA6-PS3-MOD/integration/build/*.pkg
          if-no-files-found: error
          retention-days: 14
